# General

set -s escape-time 10                       # faster command sequences

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g history-limit 100000

set-option -g mouse on
set-window-option -g mode-keys vi

# Reload configuration
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Terminal: keep xterm-256color for VIM Shift-arrow mappings, enable true color
set -g default-terminal "xterm-256color"
set -s terminal-features[90] "xterm*:RGB"

# Copy-to-clipboard: Wayland (wl-clipboard) or X11 (xclip)
set -g update-environment[90] WAYLAND_DISPLAY
set -s copy-command 'if [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy > /dev/null; then wl-copy; else xclip -in -selection clipboard; fi'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi c send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Display

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

setw -g monitor-activity on

set -g status-style fg=white,bg=black
set -g status-right "#{?client_prefix,[P] ,}#[bg=red,fg=#ffffff,bright] #H "
setw -g window-status-current-style "bg=#00afff,fg=#000000,bold"

setw -g allow-rename on

set -g focus-events on

# Windows & Pane

# splitting panes in current path
unbind %
unbind '"'
bind _ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# open new window in current path
bind c new-window -c '#{pane_current_path}'

# Use ALT-arrow keys WITHOUT PREFIX KEY to switch windows
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n M-Up last-window

# Use ALT-SHIFT-arrow keys to move windows around
bind -n M-S-Left swap-window -t -1
bind -n M-S-Right swap-window -t +1

# Use also Shift-PGUP to enter copy-mode
bind -n S-PPage copy-mode -u
